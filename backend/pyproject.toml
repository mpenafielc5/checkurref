[project]
name = "checkurref-backend"
version = "0.1.0"
description = "API de CheckUrRef: auditoría de referencias bibliográficas con NLI."
requires-python = ">=3.10"

# Las dependencias se instalan con requirements.txt / requirements-dev.txt.
# Este archivo solo configura las herramientas de calidad.

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/W: estilo PEP 8 · F: errores · I: orden de imports · UP: sintaxis moderna
# B: errores comunes · SIM: simplificaciones · N: nombres PEP 8
select = ["E", "W", "F", "I", "UP", "B", "SIM", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
